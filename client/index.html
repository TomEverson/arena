<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arena</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        top: 8px;
        left: 8px;
        color: #9f9;
        font: 12px/1.4 monospace;
        white-space: pre;
        pointer-events: none;
        text-shadow: 1px 1px 0 #000;
      }
      #hint {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font: 16px monospace;
        background: rgba(0, 0, 0, 0.4);
        cursor: pointer;
      }
      #hint.hidden {
        display: none;
      }
      #crosshair {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 0;
        height: 0;
        pointer-events: none;
        --gap: 8px;
      }
      #crosshair i {
        position: absolute;
        background: #fff;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.55);
      }
      #crosshair .t {
        width: 2px;
        height: 8px;
        left: -1px;
        top: calc(-8px - var(--gap));
      }
      #crosshair .b {
        width: 2px;
        height: 8px;
        left: -1px;
        top: var(--gap);
      }
      #crosshair .l {
        width: 8px;
        height: 2px;
        top: -1px;
        left: calc(-8px - var(--gap));
      }
      #crosshair .r {
        width: 8px;
        height: 2px;
        top: -1px;
        left: var(--gap);
      }
      #crosshair .d {
        width: 2px;
        height: 2px;
        left: -1px;
        top: -1px;
      }
      #hitmarker {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 0;
        height: 0;
        pointer-events: none;
        opacity: 0;
      }
      #hitmarker::before,
      #hitmarker::after {
        content: "";
        position: absolute;
        left: -11px;
        top: -1.5px;
        width: 22px;
        height: 3px;
        background: #fff;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6);
      }
      #hitmarker::before {
        transform: rotate(45deg);
      }
      #hitmarker::after {
        transform: rotate(-45deg);
      }
      #hitmarker.on {
        animation: hit 0.18s ease-out;
      }
      #hitmarker.head::before,
      #hitmarker.head::after {
        background: #ff4a4a;
      }
      #hitmarker.kill::before,
      #hitmarker.kill::after {
        background: #ffd24a;
        left: -16px;
        width: 32px;
      }
      @keyframes hit {
        from {
          opacity: 1;
          transform: scale(1.35);
        }
        to {
          opacity: 0;
          transform: scale(0.9);
        }
      }

      #vitals {
        position: fixed;
        left: 24px;
        bottom: 20px;
        color: #fff;
        font: 700 14px/1.2 monospace;
        text-shadow: 2px 2px 0 #000;
        pointer-events: none;
        width: 220px;
      }
      #vitals .bar {
        height: 10px;
        background: rgba(0, 0, 0, 0.55);
        margin-top: 4px;
        outline: 1px solid rgba(0, 0, 0, 0.8);
      }
      #vitals .bar i {
        display: block;
        height: 100%;
      }
      #vitals .shield i {
        background: #4ac0ff;
      }
      #vitals .health i {
        background: #6fe06f;
      }
      #vitals .health.low i {
        background: #ff5a4a;
      }
      #vitals .note {
        margin-top: 6px;
        font-size: 12px;
        color: #ffd24a;
        min-height: 1em;
      }
      #hurt {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        box-shadow: inset 0 0 120px 40px rgba(255, 30, 30, 0.75);
      }
      #hurt.on {
        animation: hurt 0.35s ease-out;
      }
      @keyframes hurt {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
      #death {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 8px;
        color: #fff;
        font: 700 28px monospace;
        pointer-events: none;
        background: rgba(40, 0, 0, 0.45);
        text-shadow: 2px 2px 0 #000;
      }
      #death.on {
        display: flex;
      }
      #death small {
        font-size: 16px;
        color: #ffb0a0;
      }
      #killfeed {
        position: fixed;
        top: 12px;
        right: 16px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        align-items: flex-end;
        font: 700 13px monospace;
        pointer-events: none;
      }
      #killfeed div {
        background: rgba(0, 0, 0, 0.55);
        padding: 3px 8px;
        color: #fff;
        text-shadow: 1px 1px 0 #000;
      }
      #killfeed .me {
        outline: 1px solid #ffd24a;
      }
      #killfeed .head::after {
        content: " ◆";
        color: #ff5a4a;
      }

      #matchbar {
        position: fixed;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        color: #fff;
        font: 700 16px monospace;
        text-shadow: 2px 2px 0 #000;
        background: rgba(0, 0, 0, 0.45);
        padding: 4px 14px;
        pointer-events: none;
        text-align: center;
        white-space: pre;
      }
      #matchbar small {
        display: block;
        font-size: 11px;
        font-weight: 400;
        color: #bcd;
      }
      #countdown {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        color: #fff;
        font: 700 140px monospace;
        text-shadow: 4px 4px 0 #000;
        pointer-events: none;
      }
      #countdown.on {
        display: flex;
      }
      #scoreboard,
      #results {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: none;
        background: rgba(0, 0, 0, 0.72);
        color: #fff;
        font: 14px monospace;
        padding: 16px 24px;
        min-width: 360px;
        pointer-events: none;
        text-shadow: 1px 1px 0 #000;
      }
      #scoreboard.on,
      #results.on {
        display: block;
      }
      #results h1 {
        margin: 0 0 10px;
        font: 700 34px monospace;
        text-align: center;
        color: #ffd24a;
      }
      #scoreboard table,
      #results table {
        width: 100%;
        border-collapse: collapse;
      }
      #scoreboard th,
      #results th {
        text-align: left;
        color: #9ab;
        font-weight: 400;
        border-bottom: 1px solid #456;
      }
      #scoreboard td,
      #results td,
      #scoreboard th,
      #results th {
        padding: 3px 8px;
      }
      #scoreboard td:nth-child(n + 3),
      #results td:nth-child(n + 3),
      #scoreboard th:nth-child(n + 3),
      #results th:nth-child(n + 3) {
        text-align: right;
      }
      tr.me td {
        color: #ffd24a;
        font-weight: 700;
      }
      #results .foot {
        margin-top: 12px;
        text-align: center;
        color: #9fd;
      }
      #hint {
        flex-direction: column;
        gap: 14px;
      }
      #roominfo {
        font-size: 14px;
        color: #9fd;
        text-align: center;
      }
      #roominfo button {
        font: inherit;
        margin-left: 8px;
        cursor: pointer;
        background: #234;
        color: #fff;
        border: 1px solid #567;
        padding: 2px 10px;
      }
      #roominfo .err {
        color: #ff8a7a;
        font-size: 16px;
      }
      #roominfo a {
        color: #ffd24a;
      }

      #hitlayer {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .tmark {
        position: absolute;
        transform: translate(-50%, -100%);
        width: 72px;
        text-align: center;
        display: none;
        padding-bottom: 2px; /* a hair of air between the bar and the head */
      }
      .tmark .num {
        font: 700 24px monospace;
        color: #fff;
        text-shadow:
          2px 2px 0 #000,
          -1px -1px 0 #000;
        min-height: 28px;
        transform-origin: 50% 100%;
      }
      .tmark .num.head {
        color: #ffd24a;
      }
      .tmark .num.kill {
        color: #ff5a4a;
      }
      .tmark .num.pop {
        animation: numpop 0.18s ease-out;
      }
      @keyframes numpop {
        from {
          transform: scale(1.7);
        }
        to {
          transform: scale(1);
        }
      }
      .tmark .bar {
        height: 5px;
        margin-top: 2px;
        background: rgba(0, 0, 0, 0.65);
        outline: 1px solid rgba(0, 0, 0, 0.9);
      }
      .tmark .bar i {
        display: block;
        height: 100%;
        transition: width 0.12s;
      }
      .tmark .shield i {
        background: #4ac0ff;
      }
      .tmark .health i {
        background: #ff5a4a;
      }
      #menu {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #0a0f16;
        color: #fff;
        font-family: monospace;
      }
      #menu.on {
        display: flex;
      }
      #menu h1 {
        margin: 0;
        font-size: 56px;
        letter-spacing: 12px;
        color: #ffd24a;
      }
      #menu .buttons {
        display: flex;
        gap: 20px;
      }
      #menu button {
        width: 300px;
        padding: 22px 18px;
        font: 700 22px monospace;
        color: #fff;
        cursor: pointer;
        background: #16212e;
        border: 2px solid #3a5068;
      }
      #menu button:hover {
        background: #1f3045;
        border-color: #ffd24a;
      }
      #menu button small {
        display: block;
        margin-top: 10px;
        font: 400 13px monospace;
        color: #9ab;
      }
      #menu #menu-note {
        min-height: 1.2em;
        color: #ff8a7a;
      }
      #menu a {
        color: #8ab;
        font-size: 13px;
      }
      #practice {
        position: fixed;
        left: 24px;
        top: 160px; /* below the debug text at the top left */
        color: #fff;
        font: 13px/1.5 monospace;
        pointer-events: none;
        text-shadow: 1px 1px 0 #000;
        background: rgba(0, 0, 0, 0.45);
        padding: 8px 12px;
        display: none;
      }
      #practice.on {
        display: block;
      }
      #practice b {
        color: #ffd24a;
      }
      #practice .keys {
        margin-top: 6px;
        color: #9ab;
        font-size: 11px;
      }
      #ammo {
        position: fixed;
        right: 24px;
        bottom: 20px;
        color: #fff;
        font: 700 28px/1 monospace;
        text-shadow: 2px 2px 0 #000;
        pointer-events: none;
        text-align: right;
      }
      #ammo small {
        display: block;
        font-size: 13px;
        color: #fc6;
        margin-top: 4px;
        min-height: 1em;
      }
    </style>
  </head>
  <body>
    <div id="menu">
      <h1>ARENA</h1>
      <div class="buttons">
        <button id="play-ffa">
          Play FFA
          <small>6-minute free-for-all. Share the link to bring friends.</small>
        </button>
        <button id="play-practice">
          Practice range
          <small>Movement course and shooting targets. No clock, targets do not shoot back.</small>
        </button>
      </div>
      <div id="menu-note"></div>
      <a href="?offline">no server? play offline</a>
    </div>
    <canvas id="game"></canvas>
    <div id="practice"></div>
    <div id="hud"></div>
    <div id="crosshair">
      <i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i><i class="d"></i>
    </div>
    <div id="hitmarker"></div>
    <div id="hitlayer"></div>
    <div id="ammo"></div>
    <div id="vitals"></div>
    <div id="hurt"></div>
    <div id="death"></div>
    <div id="killfeed"></div>
    <div id="matchbar"></div>
    <div id="countdown"></div>
    <div id="scoreboard"></div>
    <div id="results"></div>
    <div id="hint">
      <div id="hinttext">
        Click to play — WASD move · Space jump (hold at green walls to climb) · Shift dash · C
        crouch/slide · LMB fire · RMB aim · R reload · Tab scoreboard · Enter rematch · L copy
        invite link · P respawn (dev) · Esc release
      </div>
      <div id="roominfo"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
